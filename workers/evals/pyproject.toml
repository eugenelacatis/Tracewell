[project]
name = "tracewell-evals"
version = "0.1.0"
description = "Tracewell asynchronous eval workers"
authors = [
    { name = "Rosnita Dey", email = "rosnitasdey@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.14.0",
    "confluent-kafka>=2.16.1",
    "detoxify>=0.5.4",
    "prometheus-client>=0.26.0",
    "tracewell-proto",
]

[project.scripts]
tracewell-evals = "tracewell_evals:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
tracewell-proto = { path = "../../proto/gen/python", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []
