[project]
name = "tracewell-evals"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Rosnita Dey", email = "rosnitasdey@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.16.1",
    "prometheus-client>=0.26.0",
    "tracewell-proto",
]

[project.scripts]
tracewell-evals = "tracewell_evals:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
tracewell-proto = { path = "../../proto/gen/python", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
