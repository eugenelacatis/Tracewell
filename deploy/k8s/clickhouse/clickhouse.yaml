# ClickHouse cluster `tracewell`: 2 shards x 2 replicas = 4 pods (chi-tracewell-tracewell-<shard>-<replica>-0).
# The operator sets the {shard} and {replica} macros that deploy/migrations/clickhouse-cluster/001_cluster.sql
# relies on. Apps connect to the Service clickhouse-tracewell:9000 (any of the 4 nodes can take a
# Distributed insert).
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: tracewell
spec:
  configuration:
    users:
      # Local dev credentials, same as compose.
      tracewell/password: tracewell
      tracewell/networks/ip: "::/0"
      tracewell/profile: default
      tracewell/quota: default
    zookeeper:
      nodes:
        - host: keeper-tracewell-keeper
          port: 2181
    clusters:
      - name: tracewell
        # Lets the nodes authenticate to each other when a Distributed table forwards an insert.
        secret:
          auto: "true"
        layout:
          shardsCount: 2
          replicasCount: 2
  defaults:
    templates:
      podTemplate: clickhouse
      dataVolumeClaimTemplate: data
      serviceTemplate: svc
  templates:
    serviceTemplates:
      # The operator's default is a LoadBalancer, which stays pending on kind.
      - name: svc
        spec:
          type: ClusterIP
          ports:
            - { name: http, port: 8123 }
            - { name: tcp, port: 9000 }
    podTemplates:
      - name: clickhouse
        spec:
          containers:
            - name: clickhouse
              image: clickhouse/clickhouse-server:24.8
              resources:
                requests: { cpu: 100m, memory: 512Mi }
                limits: { memory: 1Gi }
    volumeClaimTemplates:
      - name: data
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 2Gi
