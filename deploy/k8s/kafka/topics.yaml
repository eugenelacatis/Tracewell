# The three topics, same names as docker-compose's kafka-init. 6 partitions, replication factor 3,
# min.insync.replicas=2: with acks=all, a write needs 2 of the 3 replicas, so one broker can be down.
# max.message.bytes is carried over from compose: the broker default (~1 MB) is below ingest's 5 MB body
# limit. traces.raw allows 6 MiB (ingest's producer limit); traces.dlq allows 8 MiB because it wraps the
# original payload.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: traces-raw
  labels: { strimzi.io/cluster: tracewell }
spec:
  topicName: traces.raw
  partitions: 6
  replicas: 3
  config:
    min.insync.replicas: 2
    max.message.bytes: 6291456
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: evals-results
  labels: { strimzi.io/cluster: tracewell }
spec:
  topicName: evals.results
  partitions: 6
  replicas: 3
  config:
    min.insync.replicas: 2
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: traces-dlq
  labels: { strimzi.io/cluster: tracewell }
spec:
  topicName: traces.dlq
  partitions: 6
  replicas: 3
  config:
    min.insync.replicas: 2
    max.message.bytes: 8388608
