[project]
name = "tracewell-proto"
version = "0.1.0"
description = "Generated protobuf code for proto/trace.proto. Regenerate with buf; never edit by hand."
requires-python = ">=3.11"
dependencies = ["protobuf>=5.28.3,<6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracewell_proto"]
